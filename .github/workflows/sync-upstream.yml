name: Sync Upstream

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true


on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-sync even if version exists'
        required: false
        default: 'false'
        type: boolean
  schedule:
    # Check upstream every 6 hours
    - cron: '0 */6 * * *'
  repository_dispatch:
    types: [sync-upstream]

concurrency:
  group: sync-upstream
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  sync:
    name: Sync upstream
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.push.outputs.tag || steps.skip.outputs.tag }}
      skipped: ${{ steps.skip.outputs.skipped }}
      upstream_tag: ${{ steps.push.outputs.upstream_tag || steps.upstream.outputs.tag }}
      version: ${{ steps.push.outputs.version || steps.upstream.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '~1.25.8'

      - name: Get latest upstream tag
        id: upstream
        run: |
          UPSTREAM_TAG=$(curl -sL https://api.github.com/repos/SagerNet/sing-box/releases/latest | python3 -c "import sys,json; print(json.load(sys.stdin)['tag_name'])")
          echo "tag=${UPSTREAM_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${UPSTREAM_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Found upstream tag: $UPSTREAM_TAG"

      - name: Check if v2bx tag exists
        id: check_tag
        run: |
          V2BX_TAG="v2bx-${{ steps.upstream.outputs.version }}"
          if git ls-remote --exit-code --tags origin "${V2BX_TAG}" 2>/dev/null; then
            if [[ "${{ github.event.inputs.force }}" != "true" ]]; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "tag=${V2BX_TAG}" >> "$GITHUB_OUTPUT"
              echo "Skipping: ${V2BX_TAG} already exists"
            else
              echo "exists=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download official sing-box
        if: steps.check_tag.outputs.exists != 'true'
        id: download
        run: |
          mkdir -p upstream
          curl -sL -o sing-box.tar.gz "https://github.com/SagerNet/sing-box/archive/refs/tags/${{ steps.upstream.outputs.tag }}.tar.gz"
          tar -xzf sing-box.tar.gz -C upstream --strip-components=1
          rm sing-box.tar.gz
          echo "dir=$(pwd)/upstream" >> "$GITHUB_OUTPUT"
          echo "Downloaded to $(pwd)/upstream"

      - name: Save official go.mod (MoeclubM overwrites it with old sing v0.8.1)
        if: steps.check_tag.outputs.exists != 'true'
        run: |
          cp upstream/go.mod upstream/go.sum ./
          echo "Saved official go.mod/go.sum (sing v0.8.9)"

      - name: Fetch MoeclubM v2bx.2 files
        if: steps.check_tag.outputs.exists != 'true'
        run: |
          MoeMod="v1.13.1-beta.2-v2bx.2"
          mkdir -p moeclub
          curl -sL -o moeclub.tar.gz "https://github.com/MoeclubM/sing-box_mod/archive/refs/tags/${MoeMod}.tar.gz"
          tar -xzf moeclub.tar.gz -C moeclub --strip-components=1
          rm moeclub.tar.gz
          echo "Fetched MoeclubM mod files"

      - name: Apply V2BX patches
        if: steps.check_tag.outputs.exists != 'true'
        run: |
          set -xeuo pipefail
          UPSTREAM="${{ steps.download.outputs.dir }}"
          MoeMod="$(pwd)/moeclub"

          cd "$UPSTREAM"

          # 1. third_party/sagernet/sing-vmess
          mkdir -p third_party/sagernet/sing-vmess
          cp -r ${MoeMod}/third_party/sagernet/sing-vmess/* third_party/sagernet/sing-vmess/

          # 2. *_user.go files and only the inbound overrides that provide
          # the backing user maps used by those files. Keep upstream inbound.go for
          # protocols where the old MoeclubM override no longer matches upstream APIs.
          for proto in vmess vless trojan shadowsocks tuic hysteria hysteria2 anytls; do
            mkdir -p "protocol/${proto}"
            [ -f "${MoeMod}/protocol/${proto}/${proto}_user.go" ] && cp "${MoeMod}/protocol/${proto}/${proto}_user.go" "protocol/${proto}/"
            case "$proto" in
              vless|trojan|tuic|hysteria2|anytls)
                [ -f "${MoeMod}/protocol/${proto}/inbound.go" ] && cp "${MoeMod}/protocol/${proto}/inbound.go" "protocol/${proto}/"
                ;;
            esac
          done


          # 4. adapter/neighbor_entry.go
          if ! grep -R "type NeighborEntry" -n adapter >/dev/null 2>&1; then
            cat > adapter/neighbor_entry.go << 'NBR_EOF'
          // SPDX-License-Identifier: MIT
          // Copyright (C) 2025 V2BX contributors

          package adapter

          import "net/netip"

          type NeighborEntry interface {
          	GetDestination() netip.AddrPort
          }
          NBR_EOF
          fi

          # 5. go.mod / go.sum from MoeclubM
          cp ${MoeMod}/go.mod .
          cp ${MoeMod}/go.sum .

          # 6. option file patches
          # Keep upstream option schemas when they already contain newer API/removal changes.
          # Old MoeclubM option files are tied to sing-box v1.13.1 and break newer upstreams.
          for f in dns outbound tailscale; do
            if [ -f "${MoeMod}/option/${f}.go" ]; then
              case "$f" in
                dns|outbound|tailscale)
                  echo "Keeping upstream option/${f}.go"
                  ;;
                *)
                  cp "${MoeMod}/option/${f}.go" "option/${f}.go"
                  ;;
              esac
            fi
          done
          [ -f "${MoeMod}/transport/trojan/protocol.go" ] && cp "${MoeMod}/transport/trojan/protocol.go" transport/trojan/

          # 7. GetCtx in router.go
          if ! grep -q "func (r \*Router) GetCtx()" route/router.go; then
            cat >> route/router.go << 'ROUTER_EOF'

          func (r *Router) GetCtx() context.Context {
          	return r.ctx
          }
          ROUTER_EOF
          fi

          # 8. GetCtx in adapter/router.go interface
          if ! grep -q "GetCtx()" adapter/router.go; then
            sed -i 's/type Router interface {/type Router interface {\n\tGetCtx() context.Context/' adapter/router.go
          fi

          echo "=== Patched files ==="
          find . -name "*.go" -newer ${MoeMod}/go.mod | head -20 || true

      - name: "Fix MoeclubM resolve.go API incompatibility"
        if: steps.check_tag.outputs.exists != 'true'
        run: |
          # MoeclubM's older patches can lag upstream APIs. Keep official files where
          # the current upstream API has diverged, and drop stale overrides.
          cd "${{ steps.download.outputs.dir }}"
          if grep -R "type NeighborEntry" -n adapter --exclude=neighbor_entry.go >/dev/null 2>&1; then
            rm -f adapter/neighbor_entry.go
          fi
          rm -f protocol/naive/naive_user.go
          # Rename older MoeclubM extension methods to the current upstream
          # adapter API used by sing-box v1.13.13+.
          python3 - <<'PY'
          from pathlib import Path
          for name in ('protocol/anytls/inbound.go', 'protocol/vless/inbound.go', 'protocol/trojan/inbound.go'):
              path = Path(name)
              if not path.exists():
                  continue
              content = path.read_text()
              content = content.replace('NewUpstreamContextHandlerEx', 'NewUpstreamContextHandler')
              content = content.replace('func (h *Inbound) NewConnectionEx(', 'func (h *Inbound) NewConnection(')
              content = content.replace('NewConnectionEx(ctx, conn, metadata, onClose)', 'NewConnection(ctx, conn, metadata, onClose)')
              path.write_text(content)
          PY
          echo "Fixed stale MoeclubM patches for current upstream APIs"



      - name: Restore official go.mod (MoeclubM's Apply V2BX step overwrites with sing v0.8.1)
        if: steps.check_tag.outputs.exists != 'true'
        run: |
          cp go.mod go.sum upstream/
          echo "Restored official go.mod (sing v0.8.9)"

      - name: Download Go modules
        if: steps.check_tag.outputs.exists != 'true'
        run: |
          cd "${{ steps.download.outputs.dir }}"
          GOPROXY=https://proxy.golang.org,direct go mod download 2>&1 | tail -3

      - name: Verify build
        if: steps.check_tag.outputs.exists != 'true'
        id: build
        run: |
          cd "${{ steps.download.outputs.dir }}"
          set -e
          GOEXPERIMENT=jsonv2 CGO_ENABLED=0 go build -v -trimpath -o /tmp/sing-box-test ./cmd/sing-box
          echo "size=$(stat -c%s /tmp/sing-box-test)" >> "$GITHUB_OUTPUT"
          echo "Build OK: $(du -h /tmp/sing-box-test | cut -f1)"

      - name: Commit and push
        if: steps.check_tag.outputs.exists != 'true'
        id: push
        run: |
          set -xeuo pipefail
          UPSTREAM="${{ steps.download.outputs.dir }}"
          V2BX_TAG="v2bx-${{ steps.upstream.outputs.version }}"

          cd "$UPSTREAM"
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git checkout -B v2bx-stable
          git add -A
          if git diff --cached --quiet; then
            git tag -a "${V2BX_TAG}" -m "V2BX: sync with sing-box ${{ steps.upstream.outputs.tag }}"
            git push origin "${V2BX_TAG}"
            echo "tag=${V2BX_TAG}" >> "$GITHUB_OUTPUT"
            echo "upstream_tag=${{ steps.upstream.outputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ steps.upstream.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "Tagged existing tree: ${V2BX_TAG}"
            exit 0
          fi
          git commit -m "V2BX: sync with sing-box ${{ steps.upstream.outputs.tag }}"
          git push origin v2bx-stable --force-with-lease
          git tag -a "${V2BX_TAG}" -m "V2BX: sync with sing-box ${{ steps.upstream.outputs.tag }}"
          git push origin "${V2BX_TAG}"
          echo "tag=${V2BX_TAG}" >> "$GITHUB_OUTPUT"
          echo "upstream_tag=${{ steps.upstream.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "version=${{ steps.upstream.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "Pushed: ${V2BX_TAG}"

      - name: Trigger build
        if: steps.check_tag.outputs.exists != 'true' && steps.push.outputs.tag != ''
        run: |
          echo "Triggering build for ${{ steps.push.outputs.tag }}"
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d '{"ref":"v2bx-stable","inputs":{"version":"${{ steps.upstream.outputs.tag }}"}}' \
            "https://api.github.com/repos/ouyangmland/sing-box_mod/actions/workflows/build-linux.yml/dispatches")
          body=$(echo "$response" | sed '$d')
          code=$(echo "$response" | tail -n1)
          echo "GitHub API status: $code"
          if [ -n "$body" ]; then
            echo "$body"
          fi
          if [ "$code" != "204" ]; then
            echo "Failed to dispatch build-linux"
            exit 1
          fi
          echo "Build triggered"

      - name: Create GitHub release
        if: steps.check_tag.outputs.exists != 'true' && steps.push.outputs.tag != ''
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.push.outputs.tag }}
          name: "sing-box ${{ steps.upstream.outputs.tag }}"
          body: |
            ## V2BX Release based on sing-box ${{ steps.upstream.outputs.tag }}

            Built from [sing-box ${{ steps.upstream.outputs.tag }}](https://github.com/SagerNet/sing-box/releases/tag/${{ steps.upstream.outputs.tag }}).

            ### Changes
            - Sync with upstream sing-box ${{ steps.upstream.outputs.tag }}
            - V2BX modifications

            Built automatically by GitHub Actions.
          draft: false
          prerelease: false

      - name: Output skip message
        if: steps.check_tag.outputs.exists == 'true'
        id: skip
        run: |
          echo "tag=${{ steps.check_tag.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "skipped=true" >> "$GITHUB_OUTPUT"
          echo "Upstream ${{ steps.upstream.outputs.tag }} already synced as ${{ steps.check_tag.outputs.tag }}"

  notify:
    name: Notify completion
    runs-on: ubuntu-latest
    needs: [sync]
    if: always()
    steps:
      - name: Summary
        run: |
          if [[ "${{ needs.sync.outputs.skipped }}" == "true" ]]; then
            echo "Upstream already synced. No new release needed."
          else
            echo "Sync completed: ${{ needs.sync.outputs.tag }}"
          fi
