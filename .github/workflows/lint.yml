name: Lint

on:
  push:
    branches:
      - v2bx-stable
      - v2bx-testing
      - v2bx-unstable
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/lint.yml'
  pull_request:
    branches:
      - oldstable
      - stable
      - testing
      - unstable

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ^1.25
      - name: Validate synced release build
        env:
          GOEXPERIMENT: jsonv2
          CGO_ENABLED: 0
        run: |
          cd upstream
          go build -trimpath -tags 'sing with_quic with_grpc with_utls with_wireguard with_acme with_gvisor' -o "$RUNNER_TEMP/sing-box-ci" ./cmd/sing-box
          go test -tags 'sing with_quic with_grpc with_utls with_wireguard with_acme with_gvisor' ./route/rule
