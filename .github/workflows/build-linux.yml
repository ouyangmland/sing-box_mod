name: Build Linux

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.13.6-v2bx.9)"
        required: true
        type: string
  push:
    branches:
      - v2bx-stable

jobs:
  linux-amd64:
    name: Linux amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-go@v5
        with:
          go-version: ~1.25.8
      - run: GOPROXY=https://proxy.golang.org,direct go mod download
      - name: Build
        env:
          GOEXPERIMENT: jsonv2
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          LDFLAGS="-X github.com/sagernet/sing-box/cmd.version=v${{ inputs.version }} -s -w"
          mkdir -p dist
          go build -ldflags="${LDFLAGS}" -trimpath -o dist/sing-box-linux-amd64 ./cmd/sing-box
      - uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-amd64-${{ inputs.version }}
          path: dist/sing-box-linux-amd64
          retention-days: 7

  linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-go@v5
        with:
          go-version: ~1.25.8
      - run: GOPROXY=https://proxy.golang.org,direct go mod download
      - name: Build
        env:
          GOEXPERIMENT: jsonv2
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: |
          LDFLAGS="-X github.com/sagernet/sing-box/cmd.version=v${{ inputs.version }} -s -w"
          mkdir -p dist
          go build -ldflags="${LDFLAGS}" -trimpath -o dist/sing-box-linux-arm64 ./cmd/sing-box
      - uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-arm64-${{ inputs.version }}
          path: dist/sing-box-linux-arm64
          retention-days: 7
