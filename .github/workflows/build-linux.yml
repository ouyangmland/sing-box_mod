name: Build Linux

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.13.6-v2bx.10)"
        required: true
        type: string

jobs:
  linux-amd64:
    name: Linux amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-go@v6
        with:
          go-version: ~1.25.8
      - run: GOPROXY=https://proxy.golang.org,direct go mod download
      - name: Build
        env:
          GOEXPERIMENT: jsonv2
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          VERSION="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          LDFLAGS="-X github.com/sagernet/sing-box/cmd.version=v${VERSION} -s -w"
          mkdir -p dist
          go build -ldflags="${LDFLAGS}" -tags "sing with_quic with_grpc with_utls with_wireguard with_acme with_gvisor" -trimpath -o dist/sing-box-linux-amd64 ./cmd/sing-box
      - uses: actions/upload-artifact@v6
        with:
          name: sing-box-linux-amd64
          path: dist/sing-box-linux-amd64
          retention-days: 7

  linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-go@v6
        with:
          go-version: ~1.25.8
      - run: GOPROXY=https://proxy.golang.org,direct go mod download
      - name: Build
        env:
          GOEXPERIMENT: jsonv2
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: |
          VERSION="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          LDFLAGS="-X github.com/sagernet/sing-box/cmd.version=v${VERSION} -s -w"
          mkdir -p dist
          go build -ldflags="${LDFLAGS}" -tags "sing with_quic with_grpc with_utls with_wireguard with_acme with_gvisor" -trimpath -o dist/sing-box-linux-arm64 ./cmd/sing-box
      - uses: actions/upload-artifact@v6
        with:
          name: sing-box-linux-arm64
          path: dist/sing-box-linux-arm64
          retention-days: 7

  release:
    name: Create Release
    needs: [linux-amd64, linux-arm64]
    runs-on: ubuntu-latest
    steps:

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: sing-box-linux-*
          path: ./dist-release
          merge-multiple: true

      - name: Make binaries executable
        run: |
          chmod +x ./dist-release/sing-box-linux-amd64 ./dist-release/sing-box-linux-arm64

      - name: Determine version and tag
        id: vars
        run: |
          # For workflow_dispatch, use the version input; for release events, use the tag
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FULL_TAG="${{ inputs.version }}"
          else
            FULL_TAG="${{ github.ref_name }}"
          fi
          # Strip leading v to get version string
          VERSION="${FULL_TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${FULL_TAG}" >> "$GITHUB_OUTPUT"

      - name: Notify V2bX-singbox
        run: |
          echo "Notifying V2bX-singbox with version: ${{ steps.vars.outputs.tag_name }}"
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d '{"event_type":"new-mod-release","client_payload":{"tag":"${{ steps.vars.outputs.tag_name }}"}}' \
            https://api.github.com/repos/ouyangmland/V2bX-singbox/dispatches)
          body=$(echo "$response" | sed '$d')
          code=$(echo "$response" | tail -n1)
          echo "GitHub API status: $code"
          if [ -n "$body" ]; then
            echo "$body"
          fi
          if [ "$code" != "204" ]; then
            echo "Failed to dispatch V2bX-singbox"
            exit 1
          fi
          echo "Notification sent"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: false
          name: sing-box ${{ steps.vars.outputs.tag_name }}
          files: |
            ./dist-release/sing-box-linux-amd64
            ./dist-release/sing-box-linux-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

