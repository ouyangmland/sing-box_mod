name: Build Linux

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 1.13.6-v2bx.10)"
        required: true
        type: string
  release:
    types: [published]

jobs:
  linux-amd64:
    name: Linux amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-go@v5
        with:
          go-version: ~1.25.8
      - run: GOPROXY=https://proxy.golang.org,direct go mod download
      - name: Build
        env:
          GOEXPERIMENT: jsonv2
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: |
          VERSION="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          LDFLAGS="-X github.com/sagernet/sing-box/cmd.version=v${VERSION} -s -w"
          mkdir -p dist
          go build -ldflags="${LDFLAGS}" -trimpath -o dist/sing-box-linux-amd64 ./cmd/sing-box
      - uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-amd64
          path: dist/sing-box-linux-amd64
          retention-days: 7

  linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-go@v5
        with:
          go-version: ~1.25.8
      - run: GOPROXY=https://proxy.golang.org,direct go mod download
      - name: Build
        env:
          GOEXPERIMENT: jsonv2
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: arm64
        run: |
          VERSION="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          LDFLAGS="-X github.com/sagernet/sing-box/cmd.version=v${VERSION} -s -w"
          mkdir -p dist
          go build -ldflags="${LDFLAGS}" -trimpath -o dist/sing-box-linux-arm64 ./cmd/sing-box
      - uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-arm64
          path: dist/sing-box-linux-arm64
          retention-days: 7

  release:
    name: Create Release
    needs: [linux-amd64, linux-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sing-box-linux-*
          merge-multiple: false

      - name: Make binaries executable
        run: chmod +x sing-box-linux-amd64 sing-box-linux-arm64

      - name: Determine version and tag
        id: vars
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
            TAG_NAME="v${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAG_NAME="${{ github.ref_name }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: sing-box ${{ steps.vars.outputs.version }}
          draft: false
          prerelease: false
          files: |
            sing-box-linux-amd64
            sing-box-linux-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
